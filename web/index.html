<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solana Sniper</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="modeBar" class="modebar"></div>
  <header class="top">
    <div class="brand">
      <h1 id="title"></h1>
      <p id="sub" class="muted"></p>
    </div>
    <div class="controls">
      <div id="chips" class="chips"></div>
      <div class="btns">
        <button id="killBtn" class="danger"></button>
        <button id="killAllBtn" class="danger ghost"></button>
        <button id="resumeBtn"></button>
        <button id="langBtn" class="ghost"></button>
      </div>
    </div>
  </header>
  <div id="alert" class="alert" hidden></div>
  <main class="grid">
    <section class="panel" id="capital"></section>
    <section class="panel wide">
      <nav class="tabs" id="tabs"></nav>
      <div id="tabBody" class="tabbody"></div>
    </section>
    <section class="panel" id="settings"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
